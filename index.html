<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irmãos Manhães - Catálogo</title>
<meta name="description" content="Tudo para sua reforma, casa ou negócio. Bombas, ferramentas, elétrica e mais. Compre pelo Mercado Livre.">
<link rel="icon" href="img/logo.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topo"></header>
<section class="hero"><div class="in">
  <h1>Tudo para sua Reforma, Casa ou Negócio</h1>
  <p>Bombas, ferramentas, elétrica, climatização e muito mais. 40+ anos de confiança e tradição.</p>
  <span class="sel">Compra segura pelo Mercado Livre</span>
</div></section>
<main>
  <div class="filtros">
    <input id="busca" type="search" placeholder="Buscar produto, marca ou categoria...">
    <select id="ordem"><option value="">Ordenar</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="nome">Nome (A-Z)</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cont" id="cont"></div>
  <div class="grade" id="grade"></div>
  <button class="btn sec mais" id="mais" style="display:none">Mostrar mais produtos</button>
</main>
<footer id="rodape"></footer>
<script src="js/app.js"></script>
<script>iniciarCatalogo()</script>
</body>
</html>
